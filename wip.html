<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ohana Musical Company — Coming soon</title>
  <meta name="description" content="Ohana Musical Company. Sito in costruzione. Seguici su Instagram." />
  <link rel="icon" href="img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f6f3ee;
      --muted: rgba(246, 243, 238, 0.68);
      --red: #e10613;
      --green: #b5d334;
      --accent: var(--red);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem 2rem;
      position: relative;
      isolation: isolate;
    }

    .stage.is-shrek,
    .stage:has(.logo-btn:hover),
    .stage:has(.logo-btn:focus-visible) {
      --accent: var(--green);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 35%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 68%),
        radial-gradient(circle at 50% 120%, rgba(255, 255, 255, 0.06), transparent 42%);
      transition: background 0.6s var(--ease), opacity 0.6s var(--ease);
      z-index: -2;
    }

    .stage.is-shrek::before,
    .stage:has(.logo-btn:hover)::before,
    .stage:has(.logo-btn:focus-visible)::before {
      opacity: 0.25;
    }

    .scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 0.7s var(--ease);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: blur(7px) saturate(0.92);
      transform: scale(1.08);
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 36%, rgba(8, 10, 6, 0.92) 0 28%, rgba(8, 10, 6, 0.72) 46%, rgba(8, 10, 6, 0.32) 64%, transparent 82%);
    }

    .scene-red {
      z-index: -2;
      opacity: 0.78;
    }

    .swamp {
      z-index: -1;
      opacity: 0;
    }

    .stage.is-shrek .scene-red,
    .stage:has(.logo-btn:hover) .scene-red,
    .stage:has(.logo-btn:focus-visible) .scene-red {
      opacity: 0;
    }

    .stage.is-shrek .swamp,
    .stage:has(.logo-btn:hover) .swamp,
    .stage:has(.logo-btn:focus-visible) .swamp {
      opacity: 0.78;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0.09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(40rem, 100%);
      text-align: center;
      animation: rise 1.2s var(--ease) 1.15s both;
    }

    .logo-btn {
      appearance: none;
      border: 0;
      background: none;
      cursor: pointer;
      padding: 0;
      margin: 0 auto 1.75rem;
      display: grid;
      place-items: center;
    }

    .logo-frame {
      position: relative;
      width: min(15.5rem, 68vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent),
        0 0 48px color-mix(in srgb, var(--accent) 35%, transparent);
      transition: box-shadow 0.5s var(--ease), transform 0.5s var(--ease);
      animation: float 5.5s ease-in-out infinite;
    }

    .logo-btn:hover .logo-frame,
    .logo-btn:focus-visible .logo-frame,
    .is-shrek .logo-frame {
      transform: scale(1.04);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--green) 55%, transparent),
        0 0 56px color-mix(in srgb, var(--green) 40%, transparent);
    }

    .logo-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8%;
      transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
    }

    .logo-green {
      opacity: 0;
      transform: scale(1.06);
    }

    .logo-btn:hover .logo-red,
    .logo-btn:focus-visible .logo-red,
    .is-shrek .logo-red {
      opacity: 0;
      transform: scale(0.96);
    }

    .logo-btn:hover .logo-green,
    .logo-btn:focus-visible .logo-green,
    .is-shrek .logo-green {
      opacity: 1;
      transform: scale(1);
    }

    .eyebrow {
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--accent);
      transition: color 0.45s var(--ease);
    }

    h1 {
      font-family: "Oswald", "Outfit", sans-serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 500;
      line-height: 1.05;
      margin: 0.55rem 0 0.85rem;
    }

    .lead {
      color: var(--muted);
      font-weight: 300;
      font-size: 1.05rem;
      max-width: 32rem;
      margin: 0 auto 1.1rem;
      line-height: 1.6;
    }

    .shrek-line {
      min-height: 1.4em;
      font-family: "Oswald", "Outfit", sans-serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--green);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }

    .logo-btn:hover ~ .copy .shrek-line,
    .logo-btn:focus-visible ~ .copy .shrek-line,
    .is-shrek .shrek-line {
      opacity: 1;
      transform: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.6rem;
    }

    .btn {
      --btn: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--bg);
      background: var(--btn);
      border: 1px solid var(--btn);
      border-radius: 999px;
      padding: 0.85rem 1.25rem;
      font-size: 0.92rem;
      font-weight: 500;
      transition:
        background 0.35s var(--ease),
        color 0.35s var(--ease),
        transform 0.35s var(--ease),
        border-color 0.35s var(--ease);
    }

    .btn:hover,
    .btn:focus-visible {
      --btn: var(--green);
      transform: translateY(-2px);
    }

    .btn-ghost {
      color: var(--fg);
      background: transparent;
    }

    .btn-ghost:hover,
    .btn-ghost:focus-visible {
      color: var(--bg);
      background: var(--btn);
    }

    .hint {
      margin-top: 1.4rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: rgba(246, 243, 238, 0.42);
    }

    .curtain {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 8;
      pointer-events: none;
    }

    .curtain span {
      flex: 1;
      background: linear-gradient(180deg, #1a0002, var(--red) 40%, #3a0006);
      transform: translateX(0);
      animation: open-left 1.5s cubic-bezier(0.55, 0.05, 0.2, 1) 0.15s forwards;
    }

    .curtain span:last-child {
      animation-name: open-right;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes open-left {
      to {
        transform: translateX(-102%);
      }
    }

    @keyframes open-right {
      to {
        transform: translateX(102%);
      }
    }

    .logo-btn:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 4px;
    }

    @media (hover: none) {
      .logo-frame {
        animation: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before {
        animation: none !important;
        transition: none !important;
      }

      .curtain {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="curtain" aria-hidden="true"><span></span><span></span></div>

  <main class="stage" id="stage">
    <div class="scene scene-red" aria-hidden="true">
      <img src="gs.jpeg" alt="" />
    </div>
    <div class="scene swamp" aria-hidden="true">
      <img src="images.jpg" alt="" />
    </div>
    <div class="veil" aria-hidden="true"></div>
    <div class="card">
      <button class="logo-btn" id="logoBtn" type="button" aria-pressed="false" aria-label="Passa al tema Shrek">
        <span class="logo-frame">
          <img class="logo-red" src="img/brand/ohana-lockup-on-light.png" alt="Ohana Musical Company" width="400" height="400" />
          <img class="logo-green" src="img/brand/ohana-shrek-lockup.png" alt="" width="400" height="400" />
        </span>
      </button>

      <div class="copy">
        <p class="eyebrow">Work in progress</p>
        <h1>Il sipario sta per alzarsi</h1>
        <p class="lead">
          Il sito di Ohana Musical Company è in costruzione.
          Nel frattempo seguici sui social o scrivici.
        </p>
        <p class="shrek-line">Ora in scena: Shrek the Musical</p>

        <div class="actions">
          <a class="btn" href="https://www.instagram.com/ohanamusicalcompany/" target="_blank" rel="noopener noreferrer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
            </svg>
            Instagram
          </a>
          <a class="btn btn-ghost" href="mailto:musicalcompanyohana@gmail.com">
            musicalcompanyohana@gmail.com
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const btn = document.getElementById("logoBtn");

    btn.addEventListener("click", () => {
      const on = stage.classList.toggle("is-shrek");
      btn.setAttribute("aria-pressed", String(on));
    });
  </script>
</body>
</html>
